name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "Resources/**", "Packages/GymKit/Tests/BackupTests/Fixtures/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "Resources/**", "Packages/GymKit/Tests/BackupTests/Fixtures/**", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Runner ima Android SDK (ANDROID_HOME), pa settings.gradle.kts uključuje i modul aplikacije.
      - name: Testovi i build
        run: ./gradlew check --console=plain

      # APK za testiranje na mobitelu (debug potpis, bez MoveKit klipova).
      - name: Debug APK
        if: hashFiles('android/app/build.gradle.kts') != ''
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Spremi APK
        if: hashFiles('android/app/build.gradle.kts') != ''
        uses: actions/upload-artifact@v4
        with:
          name: apolon-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
