name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "Resources/**", "Packages/GymKit/Tests/BackupTests/Fixtures/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "Resources/**", "Packages/GymKit/Tests/BackupTests/Fixtures/**", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Runner ima Android SDK (ANDROID_HOME), pa settings.gradle.kts uključuje i modul aplikacije.
      - name: Testovi i build
        run: ./gradlew check --console=plain

      # Lint u logu ispisuje samo prvu grešku; ovdje su sve.
      - name: Izvještaj linta
        if: failure()
        run: cat */build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true

      # APK-ovi za testiranje na mobitelu i satu (debug potpis, bez MoveKit klipova).
      - name: Debug APK
        if: hashFiles('android/app/build.gradle.kts') != ''
        run: ./gradlew :app:assembleDebug :wear:assembleDebug --console=plain

      # Release build kao za Google Play: R8, AAB za mobitel i sat te paket klipova (install-time asset pack).
      # MoveKit sadržaj nije u repozitoriju, pa paket ovdje dobiva probnu datoteku samo da se provjeri da ulazi u AAB.
      # AAB se ne sprema: nije potpisan i nema klipove (pravi se gradi na Macu, scripts/android-izdanje.sh).
      - name: Release AAB (provjera)
        if: hashFiles('android/app/build.gradle.kts') != ''
        run: |
          mkdir -p movekit/src/main/assets/movekit/Media
          echo probni > movekit/src/main/assets/movekit/Media/ci-probni.txt
          ./gradlew :app:bundleRelease :wear:bundleRelease --console=plain
          unzip -l app/build/outputs/bundle/release/app-release.aab | grep -q "movekit/assets/movekit/Media/ci-probni.txt" \
            || { echo "Paket klipova nije u AAB-u"; unzip -l app/build/outputs/bundle/release/app-release.aab | head -50; exit 1; }
          ls -l app/build/outputs/bundle/release/ wear/build/outputs/bundle/release/
          rm -rf movekit/src/main/assets

      - name: Spremi APK
        if: hashFiles('android/app/build.gradle.kts') != ''
        uses: actions/upload-artifact@v4
        with:
          name: apolon-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Spremi APK za sat
        if: hashFiles('android/wear/build.gradle.kts') != ''
        uses: actions/upload-artifact@v4
        with:
          name: apolon-wear-debug-apk
          path: android/wear/build/outputs/apk/debug/*.apk
          retention-days: 14
