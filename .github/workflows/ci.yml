name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Verzija Xcodea
        run: xcodebuild -version

      - name: Alati
        run: brew install xcodegen swiftlint

      - name: SwiftLint
        run: swiftlint lint --quiet

      - name: Testovi CatalogBuildera
        run: python3 -m unittest discover -s Tools/CatalogBuilder

      - name: Testovi provjere lokalizacije
        run: python3 -m unittest discover -s Tools/Localization

      - name: App Store tekstovi
        run: |
          python3 -m unittest discover -s Tools/AppStore
          python3 Tools/AppStore/check_metadata.py

      - name: Testovi paketa GymKit
        run: swift test --package-path Packages/GymKit

      - name: Generiranje projekta
        run: xcodegen generate

      # build-for-testing gradi aplikaciju i UI testove (snimke zaslona), da se i oni provjere.
      - name: Build iOS i UI testova (simulator)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project GymApp.xcodeproj \
            -scheme GymApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tee build-ios.log | tail -n 60

      # Zadnjih 60 redaka često ne sadrži samu grešku prevođenja, pa se kod pada ispišu sve greške.
      - name: Greške iOS builda
        if: failure()
        run: grep -E "error:" build-ios.log | sort -u | head -n 50 || true

      - name: Build watchOS (simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project GymApp.xcodeproj \
            -scheme GymAppWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 60

      - name: Build iOS za besplatni Personal Team (simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project GymApp.xcodeproj \
            -scheme GymApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            GYMAPP_ENTITLEMENTS_SUFFIX=-PersonalTeam \
            GYMAPP_EXTRA_CONDITIONS=PERSONAL_TEAM \
            CODE_SIGNING_ALLOWED=NO | tail -n 60

  # Izvlači tekstove iz koda u String Catalog i provjerava da svaki ima engleski prijevod.
  localization:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Alati
        run: brew install xcodegen

      - name: Generiranje projekta
        run: xcodegen generate

      - name: Izvoz lokalizacije (ažurira String Catalog iz koda)
        run: |
          set -o pipefail
          xcodebuild -exportLocalizations \
            -project GymApp.xcodeproj \
            -localizationPath build/Localizations \
            -exportLanguage en \
            CODE_SIGNING_ALLOWED=NO | tail -n 40

      - name: Promjene u katalogu nakon izvoza
        run: git diff --stat -- Resources/Localization App WatchApp

      - name: Provjera prijevoda
        run: python3 Tools/Localization/check_catalog.py
