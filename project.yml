# XcodeGen specifikacija projekta.
# GymApp.xcodeproj se ne commita: generira se naredbom `xcodegen generate`.
# Tim i potpisivanje: Config/Local.xcconfig (vidi Config/Local.xcconfig.example).
name: GymApp

options:
  bundleIdPrefix: com.brunodobric
  developmentLanguage: hr
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    # Lokalizacija: kompajler izvlači tekstove u String Catalog (Resources/Localization).
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  GymKit:
    path: Packages/GymKit

targets:

  # iPhone + iPad aplikacija
  GymApp:
    type: application
    platform: iOS
    sources:
      - App
      - Shared/Common
      - Shared/LiveActivity
      # Zajednički String Catalog (hr i en) za sve targete.
      - path: Resources/Localization
      # Katalog vježbi (catalog.json i slike) kao mapa u bundleu: Catalog/...
      - path: Resources/Catalog
        type: folder
        buildPhase: resources
      # Crteži tijela za heatmap (MuscleMap, MIT) i tekst licence: BodyMap/...
      - path: Resources/BodyMap
        type: folder
        buildPhase: resources
    dependencies:
      - package: GymKit
        products: [Units, Connectivity, Catalog, Models, Training, Planning, Stats, Backup, HealthSync, Diagnostics, Demo]
      - target: GymAppWatch
      - target: GymAppWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Apollo
        CFBundleDevelopmentRegion: hr
        CFBundleLocalizations: [hr, en]
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [remote-notification]
        NSSupportsLiveActivities: true
        # Samo Appleova enkripcija (HTTPS, iCloud): izuzeto od izvoznih pravila.
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: "Apollo čita kardio treninge (s kalorijama, udaljenošću i pulsom), tjelesnu masu i visinu kako bi ih prikazao u povijesti i praćenju tijela."
        NSHealthUpdateUsageDescription: "Apollo sprema tvoje treninge u Zdravlje kako bi se zatvarali Activity prstenovi."
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brunodobric.gymapp
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      # Snimke zaslona za App Store (scripts/snimke-zaslona.sh).
      testTargets: [GymAppUITests]

  # UI testovi: snimke zaslona za App Store s demo podacima (UITests/ScreenshotTests.swift).
  GymAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: GymApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brunodobric.gymapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  # Apple Watch aplikacija (single-target watchOS app)
  GymAppWatch:
    type: application
    platform: watchOS
    sources:
      - WatchApp
      - Shared/Common
      - Shared/WatchComplication
      # Zajednički String Catalog (hr i en) za sve targete.
      - path: Resources/Localization
    dependencies:
      - package: GymKit
        products: [Units, Catalog, Connectivity, Models, Training]
      - target: GymAppWatchWidgets
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Apollo
        CFBundleDevelopmentRegion: hr
        CFBundleLocalizations: [hr, en]
        WKApplication: true
        ITSAppUsesNonExemptEncryption: false
        WKCompanionAppBundleIdentifier: com.brunodobric.gymapp
        # HKWorkoutSession: aplikacija radi i sa spuštenim zapešćem dok traje trening.
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: "Apollo čita puls i potrošnju energije tijekom treninga."
        NSHealthUpdateUsageDescription: "Apollo sprema tvoje treninge u Zdravlje."
    configFiles:
      Debug: Config/Watch.xcconfig
      Release: Config/Watch.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brunodobric.gymapp.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
    scheme: {}

  # Widget extension: Live Activity (faza 9). Za sada samo kostur.
  GymAppWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared/LiveActivity
      # Zajednički String Catalog (hr i en) za sve targete.
      - path: Resources/Localization
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Apollo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    configFiles:
      Debug: Config/Widgets.xcconfig
      Release: Config/Widgets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brunodobric.gymapp.widgets
        GENERATE_INFOPLIST_FILE: NO

  # Complications na satu (WidgetKit za watchOS): sljedeći trening i aktivni odmor.
  GymAppWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - WatchWidgets
      - Shared/WatchComplication
      # Zajednički String Catalog (hr i en) za sve targete.
      - path: Resources/Localization
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Apollo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    configFiles:
      Debug: Config/WatchWidgets.xcconfig
      Release: Config/WatchWidgets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brunodobric.gymapp.watchkitapp.widgets
        GENERATE_INFOPLIST_FILE: NO
